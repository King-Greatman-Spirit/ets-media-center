[project]
name = "ets-media-center"
version = "1.0.0"
requires-python = ">=3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.35"
psycopg2-binary = "^2.9.10"
alembic = "^1.14.1"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
celery = "^5.4.0"
redis = "^5.2.0"
openai = "^1.40.0"
whisper = "^1.1.10"
openai-whisper = "^20231117"
bcrypt = "^4.2.0"
python-jose = "^3.3.0"
passlib = "^1.7.4"
google-api-python-client = "^2.151.0"
gunicorn = "^23.0.0"
python-multipart = "^0.0.10"
httpx = "^0.27.2"
aiofiles = "^24.1.0"

[tool.poetry.dev-dependencies]
pytest = "^8.3.0"
ruff = "^0.8.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
